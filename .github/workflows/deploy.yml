name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lilya-te/ds-workshop2.0

jobs:
  build-and-push:
    name: Build and push container
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      GENERATOR_MODEL: ${{ secrets.GENERATOR_MODEL }}
      REPAIR_MODEL: ${{ secrets.REPAIR_MODEL }}
      JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image with repository secrets
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker pull "$IMAGE"
          docker run --rm \
            --env LLM_API_KEY \
            --env LLM_BASE_URL \
            --env LLM_MODEL \
            --env GENERATOR_MODEL \
            --env REPAIR_MODEL \
            --env JUDGE_MODEL \
            --env POSTGRES_HOST \
            --env POSTGRES_DB \
            --env POSTGRES_USER \
            --env POSTGRES_PASSWORD \
            "$IMAGE" \
            python -c "from app.core.config import get_settings; get_settings(); print('config ok')"

  deploy-vm:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/lilya-te/ds-workshop2.0:${{ github.sha }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      GENERATOR_MODEL: ${{ secrets.GENERATOR_MODEL }}
      REPAIR_MODEL: ${{ secrets.REPAIR_MODEL }}
      JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync compose files to VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH:-/opt/greendata-sql}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH:-/opt/greendata-sql}/docker/postgres"
          scp docker-compose.prod.yml "${REMOTE}/docker-compose.prod.yml"
          scp docker/postgres/apply_data_model.sh "${REMOTE}/docker/postgres/apply_data_model.sh"
          scp data_model.sql "${REMOTE}/data_model.sql"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod +x ${DEPLOY_PATH:-/opt/greendata-sql}/docker/postgres/apply_data_model.sh"

      - name: Write .env on VM from repository secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cat > ${DEPLOY_PATH:-/opt/greendata-sql}/.env" <<EOF
          IMAGE=${IMAGE}
          LLM_API_KEY=${LLM_API_KEY}
          LLM_BASE_URL=${LLM_BASE_URL}
          LLM_MODEL=${LLM_MODEL}
          GENERATOR_MODEL=${GENERATOR_MODEL}
          REPAIR_MODEL=${REPAIR_MODEL}
          JUDGE_MODEL=${JUDGE_MODEL}
          POSTGRES_HOST=${POSTGRES_HOST:-postgres}
          POSTGRES_PORT=5432
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          APP_PORT=8000
          EOF

      - name: Pull and restart stack on VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/greendata-sql}" \
            GHCR_USER="${GHCR_USER}" \
            GHCR_TOKEN="${GHCR_TOKEN}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose --env-file .env -f docker-compose.prod.yml pull api
          docker compose --env-file .env -f docker-compose.prod.yml up -d
          docker compose --env-file .env -f docker-compose.prod.yml ps
          REMOTE

      - name: Post-deploy healthcheck
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
        run: |
          URL="${DEPLOY_API_URL:-http://${DEPLOY_HOST}:8000/api/v1/health}"
          for _ in $(seq 1 24); do
            if curl -fsS "$URL" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Healthcheck passed: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed: $URL" >&2
          exit 1
