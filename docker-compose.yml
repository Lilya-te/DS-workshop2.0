# Docker Compose для локальной разработки.
services:
  postgres:
    image: postgres:16-alpine
    container_name: greendata_sql_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: greendata_sql
      POSTGRES_USER: greendata
      POSTGRES_PASSWORD: greendata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data_model.sql:/schema/data_model.sql:ro
      - ./docker/postgres/apply_data_model.sh:/schema/apply_data_model.sh:ro
      - ./docker/postgres/apply_data_model.sh:/docker-entrypoint-initdb.d/02_apply_data_model.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greendata -d greendata_sql"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: greendata_sql_api
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: greendata_sql
      POSTGRES_USER: greendata
      POSTGRES_PASSWORD: greendata
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    restart: unless-stopped

volumes:
  postgres_data:
