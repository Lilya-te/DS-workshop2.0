[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # длина строки контролируется форматтером
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E402", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
